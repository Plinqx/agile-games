<script>
'use strict';
const GAMES = [{"id":"coin","title":"Five Customer Orders","short":"Five Customer Orders","category":"FLOW","players":"4–6","roundSecs":90,"timerMode":"stopwatch","unit":"sec","higherBetter":false,"hook":"When does the first customer get their order?","tagline":"Five coins represent five customer orders moving through a team.","kit":"5 coins; one blank A4 sheet per station; pens; on-screen stopwatch","setup":["Line up 4–6 players. Each is one step in a customer order.","Give each player blank A4; write R1 and R2, with space for five H/T marks.","Each coin is one order. Everyone tosses and records H or T."],"round1Label":"Wait for all five","round1":["Player 1 tosses and records all five coins, then passes the full batch.","Each next player repeats before handing all five to the next.","Time the first and final order reaching the last person."],"round2Label":"Pass each one on","round2":["Return all five coins to Player 1 and start again.","Toss, mark H/T, and pass EACH coin immediately to the next person.","Time the first and final completed order; compare fairly."],"measure":"Seconds until all five orders finish","recordHint":"Also compare the first customer order finished.","reveal":"An order need not wait for four others before moving on.","nuance":"The first order often finishes earlier; the final result depends on the line and handoff effort.","question":"Where do customer orders sit waiting for the next step?","monday":"Look for one handoff where work can move sooner.","safe":"Keep orders moving; reduce unnecessary waiting.","n":1,"accent":"#5C2C98","icon":"coins","hostPrep":["No recording grid needed. Each player draws two rows on ordinary A4: R1 and R2. Mark H/T five times in each row.","Use only the same five coins in both rounds. No extra markers or products are required.","Keep the same people in the same order. Compare first completed coin as well as time to all five."]},{"id":"switch","title":"The Busy Store Manager","short":"Busy Store Manager","category":"FOCUS","players":"2–6","roundSecs":90,"timerMode":"stopwatch","unit":"sec","higherBetter":false,"hook":"Three jobs on your desk. Which way feels quicker?","tagline":"Stock count, delivery labels and returns — all at once.","kit":"2 blank A4 sheets per player, folded into thirds; ballpoint pens; timer","setup":["Fold TWO blank A4 sheets into three columns per person.","Label them STOCK, DELIVERIES, RETURNS using a pen.","Each sheet uses STOCK 1–12, DELIVERIES A–L, RETURNS 12–1."],"round1Label":"Jump between jobs","round1":["Use the first sheet. Work across one row at a time.","Write 1 / A / 12, then 2 / B / 11, and so on to row 12.","Time all 36 entries and count errors."],"round2Label":"Finish one job first","round2":["Use the second blank folded sheet with identical headings.","Finish STOCK 1–12, then A–L, then RETURNS 12–1.","Time the same 36 entries; compare errors and speed."],"measure":"Seconds to finish all three lists","recordHint":"Compare mistakes, too — practice can affect the second round.","reveal":"Changing jobs repeatedly takes attention away from finishing.","nuance":"This illustrates attention switching; it is not a scientific measure of store productivity.","question":"What interrupts your team most often during a busy shift?","monday":"Protect small periods of focused time for priority tasks.","safe":"Focus reduces avoidable switching.","n":2,"accent":"#B02B50","icon":"switch","hostPrep":["Use A4 portrait. Fold paper to make three columns—no ruler, printing or grid required.","Write STOCK, DELIVERIES and RETURNS on the top of both folded pages.","Round 1: Across rows e.g. 1, A, 12; 2, B, 11. Round 2: Down columns 1–12; A–L; 12–1.","Learning/practice may help round 2. Ask participants whether it felt less confusing, rather than claiming guaranteed speed."]},{"id":"bottleneck","title":"Click & Collect Rush","short":"Click & Collect Rush","category":"BOTTLENECK","players":"4–6","roundSecs":60,"timerMode":"countdown","unit":"orders","higherBetter":true,"hook":"Why are customers waiting when the whole team is busy?","tagline":"PICK → PACK → HANDOVER. Watch the queue build.","kit":"6 A4 sheets torn into 24 slips; 3 index-card signs; tape; pens; timer","setup":["Handwrite PICK, PACK and HANDOVER on three index cards.","Fold 6 A4 sheets twice and tear into 24 order slips.","Mark a waiting queue with tape. Use 2 PICK, 1 PACK, 1 HANDOVER."],"round1Label":"Let the queue build","round1":["PICK adds ✓; PACK writes READY FOR COLLECTION; HANDOVER initials.","Pass slips through all three stages; only finished slips count.","In 60 sec count fully done slips and those waiting at PACK."],"round2Label":"Help where it is stuck","round2":["Turn the same 24 slips over to their blank side.","Move a second person to PACK: 1 PICK, 2 PACK, 1 HANDOVER.","Run another 60 sec and count completed orders and queue."],"measure":"Customer orders completed in 60 sec","recordHint":"Also count cards waiting at PACK in both rounds.","reveal":"The slowest step controls how quickly orders reach customers.","nuance":"The queue may move after the change; the aim is to see the whole process, not blame a person.","question":"Where do orders build up in your store or distribution centre?","monday":"Make the queue visible and help the step causing the delay.","safe":"Fix the queue, not just the busiest-looking task.","n":3,"accent":"#955113","icon":"bottleneck","hostPrep":["Index cards remain as reusable signs. DO NOT write on them during the rounds.","Make order slips from A4, not your limited supply of index cards: quarter 6 sheets to make 24 slips.","Use one side of each slip for round 1, then turn the same slips over for round 2.","Coloured sticky tape marks the PICK, PACK, HANDOVER and DONE zones on the tabletop.","A fully completed slip must have ✓, READY FOR COLLECTION, and the final person's initials."]},{"id":"approval","title":"Can Someone Approve This?","short":"Approve This?","category":"DECISIONS","players":"3–6","roundSecs":60,"timerMode":"stopwatch","unit":"sec","higherBetter":false,"hook":"What happens when one person must approve everything?","tagline":"A simulated customer-service desk with one busy manager.","kit":"12 handwritten reusable index cards; tape for DONE zone; timer","setup":["Label 10 index cards ROUTINE and 2 EXCEPTION; reuse all 12.","Choose one manager and at least two customer-service teammates.","Tape a REQUESTS and DONE area. This is a fictional game rule."],"round1Label":"Ask the manager for all","round1":["All 12 cards go through the manager, one at a time.","Manager waits 4 seconds before approving EACH card and moving it to DONE.","Use the stopwatch. Stop when all 12 requests reach DONE."],"round2Label":"Give the team clear rules","round2":["Return the same 12 cards to REQUESTS and reset the stopwatch.","Team handles 10 ROUTINE cards immediately; only 2 EXCEPTION cards go to the manager.","Manager still takes 4 seconds per exception. Stop when all 12 reach DONE."],"measure":"Time to clear all 12 requests","recordHint":"Managerial approval is 4 seconds per card in both rounds. Count only correct approvals; the same 12 cards must finish.","reveal":"Routine decisions can move quicker while important exceptions still get manager oversight.","nuance":"Both rounds complete all 12 cards. Compare the total time rather than the number processed in a minute.","question":"Which everyday decisions could be made closer to the customer?","monday":"Ask where clear decision rules could replace needless waiting.","safe":"Keep important controls; simplify routine decisions.","n":4,"accent":"#B32445","icon":"approval","hostPrep":["Write 10 reusable ROUTINE request cards: Find stock, Confirm collection, Check order status, Delivery question, Locate item, Update contact details, Check store hours, Confirm delivery window, Standard enquiry, Collection reminder.","Write two EXCEPTION cards: Missing proof / policy exception and Unusual high-value issue.","Do not label cards as actual Amart policy; this is purely a game about hypothetical escalation rules.","You need NO approval stamp. Move cards into a DONE area marked with tape. Never mark the reusable cards during play.","Use the on-screen stopwatch to time all 12 cards; the manager takes about 4 seconds per approval in either round."]},{"id":"feedback","title":"Build My Showroom","short":"Build My Showroom","category":"FEEDBACK","players":"2–6","roundSecs":60,"timerMode":"countdown","unit":"features","higherBetter":true,"hook":"Could you set up a showroom from a one-way instruction?","tagline":"One person knows the furniture layout. The others draw it.","kit":"2 secret index-card sketches hand-drawn in advance; blank A4; pens","setup":["Draw two simple showroom plans on index cards; keep them hidden.","Choose a designer; only that player sees the first sketch.","Everyone else draws the layout on plain A4."],"round1Label":"No questions allowed","round1":["Designer describes sketch A without showing it.","No questions and no showing the drawing back to designer.","After 60 sec count correct placements out of six."],"round2Label":"Ask and check as you go","round2":["Designer uses sketch B with six similar placements.","Builders may ask questions and show drawings as they go.","After 60 sec count six placements again."],"measure":"Layout features correct out of six","recordHint":"Use different, comparable layouts to limit the memory advantage.","reveal":"A quick question can prevent a whole display being set up wrong.","nuance":"The two drawings are matched approximations, not identical tasks.","question":"How often would a quick clarification save rework at work?","monday":"Invite quick check-ins before a job is almost finished.","safe":"Ask early; check together; avoid rework.","n":5,"accent":"#205984","icon":"feedback","hostPrep":["Draw the two secret index cards once and REUSE them with every group. Show them ONLY to the person describing.","Sketch A (six features): sofa centre; rug under sofa; coffee table on rug; standing lamp left; plant right; price ticket bottom-left.","Sketch B (six features): bed centre; bedside table left; bedside table right; framed artwork above; lamp upper-right; narrow rug below.","Draw crude symbols (box/oval/circle)—accuracy of artwork does not matter. Six obvious positions do.","Each builder uses one blank A4 sheet per round. Score positions after time is up."]},{"id":"estimate","title":"How Long Will Pickup Take?","short":"Pickup Time Surprise","category":"CLARITY","players":"3–6","roundSecs":90,"timerMode":"countdown","unit":"min","higherBetter":false,"hook":"How long does it take to prepare ten pickup orders?","tagline":"Same request. Different assumptions.","kit":"Blank A4 for private estimates; ballpoint pens; spoken scenario","setup":["Ask for a minutes estimate to prepare 10 pickup orders.","Everyone writes one number on a blank scrap of A4.","Compare the highest and lowest estimates."],"round1Label":"Guess with missing details","round1":["Say: “Prepare ten customer orders for collection.”","Everyone reveals their estimate at the same time.","Ask what they assumed about stock locations and staffing."],"round2Label":"Now give the whole picture","round2":["Now reveal: 8 are ready; 2 are in reserve; 1 needs a check.","Take questions on team size and travel time.","Estimate again; compare the spread from highest to lowest."],"measure":"Spread between highest and lowest (min)","recordHint":"Enter the range, not the average. The second range could widen if new risks emerge.","reveal":"Different estimates often mean different pictures of the job.","nuance":"This exercise aligns assumptions; it does not make an actual pickup-time promise.","question":"How often do we agree on a time before agreeing what is involved?","monday":"Clarify the job before committing to the timeline.","safe":"A shared picture comes before a reliable estimate.","n":6,"accent":"#216075","icon":"estimate","hostPrep":["No pickup brief, reveal card or Planning Poker deck needed.","Say round 1 prompt out loud: “Prepare ten customer orders for collection.”","Round 2 reveal verbally: 8 ready on shelf; 2 in reserve bay; 1 of those needs extra packaging check.","If asked, set simple mock conditions consistently (e.g. two team members, same-store pickup area).","Have participants write estimates on A4; compare high minus low, not accuracy to an invented correct number."]}];
const STATE_KEY = 'sleeq-amart-no-print-challenges-v4';
const icons={coins:'◌ ◉',switch:'⇄',bottleneck:'⟶',approval:'✓',feedback:'◉',estimate:'≈'};
const app=document.getElementById('app');
let page='home', current=0, stage=0;
let state={team:'Team 1',scores:{},results:[]};
try{const s=JSON.parse(localStorage.getItem(STATE_KEY)||'null');if(s&&typeof s==='object')state={...state,...s}}catch(_e){}
let timer={running:false,elapsed:0,startAt:0,tickHandle:null,limit:60,mode:'stopwatch'};
const elapsed=()=>timer.elapsed+(timer.running?(performance.now()-timer.startAt):0);
function safe(text){return String(text??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){try{localStorage.setItem(STATE_KEY,JSON.stringify(state))}catch(_e){}}
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove('show'),2600)}
function resetTimer(){if(timer.tickHandle)clearInterval(timer.tickHandle);timer={running:false,elapsed:0,startAt:0,tickHandle:null,limit:GAMES[current].roundSecs,mode:GAMES[current].timerMode}}
function timerSeconds(){return Math.max(0,Math.round(elapsed()/1000))}
function formatClock(){let ms=elapsed();let seconds=timer.mode==='countdown'?Math.max(0,Math.ceil(timer.limit-ms/1000)):Math.floor(ms/1000);return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
function updateClock(){const clock=document.querySelector('.clock-display');if(!clock)return;clock.textContent=formatClock();let expire=timer.mode==='countdown'&&elapsed()>=timer.limit*1000;clock.classList.toggle('expired',expire);const bar=document.querySelector('.clock-progress');if(bar){bar.style.width=timer.mode==='countdown'?`${Math.max(0,100*(1-elapsed()/1000/timer.limit))}%`:`${Math.min(100,elapsed()/1000/timer.limit*100)}%`}const starter=document.getElementById('timerToggle');if(starter)starter.textContent=timer.running?'Pause':timer.elapsed>0?'Resume':'Start';if(expire&&timer.running){pauseTimer();toast('Time is up — record the result.')}}
function startTimer(){if(!timer.running){timer.running=true;timer.startAt=performance.now();timer.tickHandle=setInterval(updateClock,90)}updateClock()}
function pauseTimer(){if(timer.running){timer.elapsed+=performance.now()-timer.startAt;timer.running=false;if(timer.tickHandle)clearInterval(timer.tickHandle);timer.tickHandle=null}updateClock()}
function switchTimer(){if(timer.running)pauseTimer();else startTimer()}
function getGameScore(g){if(!state.scores[g.id])state.scores[g.id]={r1:'',r2:''};return state.scores[g.id]}
function formatNum(n){return Number.isInteger(n)?String(n):n.toFixed(1)}
function deltaHTML(g,sc){let a=Number(sc.r1),b=Number(sc.r2);if(sc.r1===''||sc.r2===''||!Number.isFinite(a)||!Number.isFinite(b))return '<span class="muted-note">Enter both round scores to see the comparison.</span>';
let dif=b-a,change=a!==0?Math.abs(dif/a*100):null;let improved=g.higherBetter?dif>0:dif<0;let tie=dif===0;let label=tie?'No measured change':improved?'Improved':'Did not improve';let mark=tie?'↔':improved?'↗':'↘';return `<strong>${mark} ${safe(label)}</strong><div class="muted-note">Round 1: <b>${formatNum(a)}</b> ${safe(g.unit)} · Round 2: <b>${formatNum(b)}</b> ${safe(g.unit)} · Change: <b>${dif>0?'+':''}${formatNum(dif)}</b>${change!==null?' ('+change.toFixed(0)+'%)':''}. Different outcomes are useful evidence.</div>`}
function setScore(which,value){let g=GAMES[current],sc=getGameScore(g);sc[which]=value;save();const delta=document.getElementById('deltaBox');if(delta)delta.innerHTML=deltaHTML(g,sc)}
function useTimer(which){let g=GAMES[current];if(g.timerMode!=='stopwatch')return;pauseTimer();let value=(elapsed()/1000).toFixed(1);getGameScore(g)[which]=value;save();const el=document.getElementById('scoreValue');if(el)el.value=value;toast('Recorded '+value+' seconds');updateClock()}

function footer(extra=''){return `<div class="footer-line"><span>SLEEQ × STORECONNECT · AMART CONFERENCE &nbsp;  ${safe(extra)}</span><span>← / → Navigate · Esc Menu · Space Timer</span></div>`}
function render(){document.documentElement.style.setProperty('--accent',page==='game'?GAMES[current].accent:'#542A94');
if(page==='home')renderHome();else if(page==='menu')renderMenu();else if(page==='game')renderGame();else if(page==='board')renderBoard();else if(page==='wheel')renderWheel();
window.scrollTo(0,0);}

// Each of the seven sectors has equal probability; the selected result drives the animation.
const WHEEL_LABELS=[['CUSTOMER','ORDERS'],['BUSY STORE','MANAGER'],['CLICK &','COLLECT'],['APPROVE','THIS?'],['BUILD MY','SHOWROOM'],['PICKUP TIME','SURPRISE']];
const WHEEL_COLOURS=['#5C3196','#863957','#31527E','#743A80','#2F6177','#315A70'];
let wheelAngle=0, wheelBusy=false, wheelSpinTimeout=null, wheelReadyTimeout=null, wheelSelected=null;
function randomGameIndex(){
 const n=GAMES.length;
 if(window.crypto&&typeof window.crypto.getRandomValues==='function'){
  const max=Math.floor(4294967296/n)*n, value=new Uint32Array(1);
  do{window.crypto.getRandomValues(value)}while(value[0]>=max);
  return value[0]%n;
 }
 return Math.floor(Math.random()*n);
}
function wheelArtwork(){
 const n=GAMES.length, step=360/n, radius=280;
 const polar=(r,d)=>[300+r*Math.cos(d*Math.PI/180),300+r*Math.sin(d*Math.PI/180)];
 const sectors=GAMES.map((g,i)=>{
  const mid=-90+i*step;
  const [x0,y0]=polar(radius,mid-step/2),[x1,y1]=polar(radius,mid+step/2);
  const [tx,ty]=polar(188,mid),[nx,ny]=polar(102,mid);
  const label=WHEEL_LABELS[i];
  return `<path d="M300 300 L${x0.toFixed(2)} ${y0.toFixed(2)} A${radius} ${radius} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" fill="${WHEEL_COLOURS[i]}" stroke="#DCC9FF" stroke-width="2.6"/>`+
   `<g transform="rotate(${i*step} ${tx.toFixed(2)} ${ty.toFixed(2)})"><text class="wheel-label" x="${tx.toFixed(2)}" y="${(ty-8).toFixed(2)}" text-anchor="middle" fill="white" font-size="17" font-weight="850">${safe(label[0])}</text><text class="wheel-label" x="${tx.toFixed(2)}" y="${(ty+14).toFixed(2)}" text-anchor="middle" fill="white" font-size="17" font-weight="850">${safe(label[1])}</text></g>`+
   `<text class="wheel-number" x="${nx.toFixed(2)}" y="${(ny+7).toFixed(2)}" fill="#F6F0FF" font-size="25" font-weight="900" text-anchor="middle">${i+1}</text>`;
 }).join('');
 return `<svg id="wheelDisc" class="wheel-disc" viewBox="0 0 600 600" role="img" aria-label="Game selection wheel with six equal sections" style="transform:rotate(${wheelAngle}deg)"><circle cx="300" cy="300" r="293" fill="#101C36"/>${sectors}</svg>`;
}
function renderWheel(){
 app.innerHTML=header()+`<main class="frame"><div class="wheel-layout"><section class="wheel-copy"><div class="eyebrow">SIX RETAIL GAMES · ONE RANDOM PICK</div><h1 class="h1">Let the wheel<br>pick your challenge.</h1><p class="sub">No choosing, no arguing. Give it a spin and see which retail challenge your team gets!</p><div class="wheel-actions"><button class="btn" id="wheelSpin" onclick="spinWheel()">🎡 Spin again</button><button class="btn" id="wheelStart" onclick="startSelectedGame()" disabled>Start selected game →</button><button class="btn btn-ghost" onclick="goMenu()">Choose a game instead</button></div><div class="wheel-status" id="wheelStatus" role="status" aria-live="polite">Ready to spin…</div><p class="wheel-caption">Every spin gives each of the six games an equal chance. Spin again, or press Start selected game when you are ready.</p></section><section class="wheel-area" aria-label="Spinning game wheel"><div class="wheel-wrap"><div class="wheel-pointer" aria-hidden="true"></div>${wheelArtwork()}<div class="wheel-hub" aria-hidden="true"><span>AMART<br>× SLEEQ</span></div></div></section></div>${footer('Random game picker · no printing needed')}</main>`;
}
function cancelWheel(){
 if(wheelReadyTimeout!==null){clearTimeout(wheelReadyTimeout);wheelReadyTimeout=null}
 if(wheelSpinTimeout!==null){clearTimeout(wheelSpinTimeout);wheelSpinTimeout=null}
 wheelBusy=false;
 wheelSelected=null;
}
function openWheel(){
 pauseTimer();cancelWheel();page='wheel';render();
 // Paint the wheel before beginning the spin when opened from the home button.
 wheelReadyTimeout=setTimeout(()=>{wheelReadyTimeout=null;if(page==='wheel')spinWheel()},200);
}
function startSelectedGame(){
 if(page==='wheel'&&!wheelBusy&&Number.isInteger(wheelSelected)&&wheelSelected>=0&&wheelSelected<GAMES.length){startGame(wheelSelected)}
}
function spinWheel(){
 if(page!=='wheel'||wheelBusy)return;
 const selected=randomGameIndex();wheelBusy=true;wheelSelected=null;
 const reduced=!!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
 const duration=reduced?0:4900;
 const curr=((wheelAngle%360)+360)%360;
 const target=((360-selected*360/GAMES.length)%360+360)%360;
 const extra=(target-curr+360)%360;
 wheelAngle+=360*(5+Math.floor(Math.random()*3))+extra;
 const disc=document.getElementById('wheelDisc');
 const button=document.getElementById('wheelSpin');
 const startButton=document.getElementById('wheelStart');
 const status=document.getElementById('wheelStatus');
 if(!disc||!button||!startButton||!status){wheelBusy=false;return}
 button.disabled=true;startButton.disabled=true;startButton.textContent='Start selected game →';
 status.textContent=reduced?'Picking a challenge…':'Spinning… which game will it be?';
 disc.style.transition=`transform ${duration}ms cubic-bezier(.13,.75,.12,1)`;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  if(page==='wheel'&&disc.isConnected)disc.style.transform=`rotate(${wheelAngle}deg)`;
 }));
 wheelSpinTimeout=setTimeout(()=>{
  wheelSpinTimeout=null;
  if(page!=='wheel')return;
  wheelSelected=selected;wheelBusy=false;
  status.innerHTML=`🎉 <strong>${safe(GAMES[selected].title)}</strong>! Ready when you are.`;
  button.disabled=false;
  startButton.disabled=false;
  startButton.textContent=`Start ${GAMES[selected].short} →`;
 },duration+90);
}

function renderHome(){app.innerHTML=header()+`<main class="frame"><div class="hero"><div class="orbit"><div class="dot"></div></div><div class="hero-body"><div class="no-print-ribbon">✓ NO PRINTER · NO EXTRA PROPS · WORKS OFFLINE</div><div class="eyebrow">AMART TEAM CHALLENGES · HOSTED WITH SLEEQ & STORECONNECT</div><h1 class="display">LESS TALK.<br><em>MORE FLOW.</em></h1><p class="lead">Six everyday store and distribution challenges. No printing needed. Ten minutes per team. Two rounds. One great conversation.</p><div class="hero-actions" style="margin-top:36px"><button class="btn" onclick="openWheel()">🎡 Spin the wheel →</button><button class="btn btn-ghost" onclick="goMenu()">Choose a challenge ↗</button><button class="btn btn-ghost" onclick="startGame(0)">Run Five Customer Orders →</button></div></div><div><div class="intro-grid"><div class="statbox"><strong>06</strong><span>Micro-experiments</span></div><div class="statbox"><strong>10 min</strong><span>Active game time</span></div><div class="statbox"><strong>15 min</strong><span>Booth rotation</span></div></div>${footer('Amart conference · facilitator edition · 2026')}</div></div></main>`}
function renderMenu(){app.innerHTML=header()+`<main class="frame"><div class="menu-top"><div><div class="eyebrow">CHOOSE YOUR EXPERIMENT</div><h1 class="h1">Six retail games. Six <span style="color:var(--lime)">lightbulb moments.</span></h1><p class="sub">Pick one familiar retail challenge per team. No printing needed — use blank A4, index cards, tape and pens. Each game has two rounds and a timer.</p></div><div class="wheel-menu-btn"><button class="btn btn-small" onclick="openWheel()">🎡 Spin the wheel</button></div></div><section class="menu-grid">${GAMES.map((g,i)=>`<button class="game-tile" style="--color:${g.accent}" onclick="startGame(${i})" aria-label="Start ${safe(g.title)}"><div><div class="tile-num">EXPERIMENT ${String(i+1).padStart(2,'0')} · ${safe(g.category)}</div><div class="tile-icon">${icons[g.icon]}</div><h2 class="tile-name">${safe(g.title)}</h2><div class="tile-hook">${safe(g.hook)}</div></div><div class="tile-foot"><span>${safe(g.players)} PLAYERS</span><span class="arrow">↗</span></div></button>`).join('')}</section><section class="menu-bottom"><div class="banner"><strong>Recommended first rotation:</strong> Five Customer Orders → Busy Store Manager → Click & Collect Rush → Approve This?. These four use your existing supplies and demonstrate flow, focus, bottlenecks and decisions.<div style="margin-top:10px"><button class="btn btn-small" onclick="startGame(0)">Start the rotation →</button></div></div><div class="banner banner-facilitator"><strong>For facilitators:</strong> Run one game per group. Use ordinary A4 and reusable index cards. Change one condition at a time; record what actually happens.<div style="margin-top:10px"><button class="btn btn-small btn-ghost" onclick="openPrep(-1)">View no-print prep ↗</button></div></div></section>${footer('Select a card or press 1–6')}</main>`}
function stepper(){let names=['Set up','Round 1','Round 2','Debrief'];return `<nav class="stepper" aria-label="Challenge stages">${names.map((s,i)=>`<button class="step ${i===stage?'active':i<stage?'done':''}" onclick="setStage(${i})"><span class="ball">${i+1}</span>${s}</button>`).join('')}</nav>`}
function scoreControl(g,which){const sc=getGameScore(g);return `<div class="smallcard"><div class="small-label">Record ${which==='r1'?'round 1':'round 2'}</div><div class="round-score-card"><div class="data-input"><label for="scoreValue">${safe(g.measure)} (${safe(g.unit)})</label><input id="scoreValue" type="number" min="0" step="any" placeholder="Enter measured result" value="${safe(sc[which])}" oninput="setScore('${which}',this.value)"></div>${g.timerMode==='stopwatch'?`<button class="btn btn-small btn-quiet" onclick="useTimer('${which}')">Use timer</button>`:''}</div><p class="micro" style="margin:10px 0 0">${safe(g.recordHint)}</p></div>`}
function clockHTML(g){return `<div class="clock"><div class="clock-label">${g.timerMode==='countdown'?`${g.roundSecs}-SECOND COUNTDOWN`:'LIVE STOPWATCH'}</div><div class="clock-display" aria-live="off">${g.timerMode==='countdown'?String(Math.floor(g.roundSecs/60)).padStart(2,'0')+':'+String(g.roundSecs%60).padStart(2,'0'):'00:00'}</div><div class="clock-progress" style="width:${g.timerMode==='countdown'?'100':'0'}%"></div><div class="clock-controls"><button id="timerToggle" class="btn btn-small" onclick="switchTimer()">Start</button><button class="btn btn-small btn-ghost" onclick="resetTimer();updateClock()">Reset</button></div><div class="clock-tip">Space = start / pause. Stop at the same point each round.</div></div>`}
function roundBody(g,which){return `<div class="stage-chip">${which===1?'ROUND ONE':'ROUND TWO'} / ${which===1?safe(g.round1Label):safe(g.round2Label)}</div><h2 class="main-title">${which===1?safe(g.round1Label):safe(g.round2Label)}</h2><ul class="step-list">${(which===1?g.round1:g.round2).map(x=>`<li>${safe(x)}</li>`).join('')}</ul><div class="stage-foot">Measure: ${safe(g.measure)}. ${which===1?'Record the baseline before changing the rule.':'Same team, same metric, one process change.'}</div>`}
function renderGame(){let g=GAMES[current],sc=getGameScore(g),left='',right='';
if(stage===0){left=`<div class="stage-chip">BEFORE THE CLOCK STARTS</div><h2 class="main-title">${safe(g.hook)}</h2><p class="main-body">${safe(g.tagline)}</p><ul class="setup-list">${g.setup.map(t=>`<li>${safe(t)}</li>`).join('')}</ul><div class="stage-foot">FACILITATOR TIP · Set a single start/finish definition before Round 1.</div>`;right=`<div class="smallcard"><div class="small-label">From your existing supplies</div><div class="kit">${safe(g.kit)}</div><div class="line"></div><div class="tool-row"><span class="count">${safe(g.players)} players</span><span class="tag">10 MINUTES</span></div></div><div class="smallcard"><div class="small-label">What changes?</div><div class="metric-row"><span>Round 1</span><strong>${safe(g.round1Label)}</strong></div><div class="metric-row"><span>Round 2</span><strong>${safe(g.round2Label)}</strong></div><div class="metric-row"><span>Compare</span><strong>${safe(g.unit)}</strong></div></div><button class="btn btn-ghost" onclick="openPrep(current)">View hand-written setup ↗</button>`}
if(stage===1||stage===2){let which=stage===1?'r1':'r2';left=roundBody(g,stage);right=clockHTML(g)+scoreControl(g,which)}
if(stage===3){left=`<div class="stage-chip">THE REVEAL</div><h2 class="main-title" style="font-size:clamp(34px,3.4vw,52px)">What did the team discover?</h2><div class="result-hero"><h3>Round 1 vs Round 2</h3><div class="scorepair"><div class="data-input"><label for="score1">ROUND 1 · ${safe(g.unit)}</label><input id="score1" type="number" step="any" min="0" value="${safe(sc.r1)}" placeholder="0" oninput="setScore('r1',this.value)"></div><div class="data-input"><label for="score2">ROUND 2 · ${safe(g.unit)}</label><input id="score2" type="number" step="any" min="0" value="${safe(sc.r2)}" placeholder="0" oninput="setScore('r2',this.value)"></div></div><div class="delta" id="deltaBox">${deltaHTML(g,sc)}</div></div><div class="stage-foot">${safe(g.nuance)}</div>`;right=`<div class="smallcard"><div class="small-label">The insight</div><div class="takeaway">${safe(g.reveal)}</div><p class="quote">${safe(g.monday)}</p></div><div class="question">“${safe(g.question)}”</div><div class="principle">${safe(g.safe)}</div><div class="smallcard"><div class="small-label">Save this team's result</div><input aria-label="Team name" class="text-input" id="teamName" value="${safe(state.team)}" oninput="state.team=this.value;save()" placeholder="Team name"><button class="btn" style="width:100%;margin-top:10px" onclick="saveResult()">Save to results board</button></div>`}
app.innerHTML=header()+`<main class="frame"><div class="game-header"><div><div class="kicker">EXPERIMENT ${String(current+1).padStart(2,'0')} · ${safe(g.category)}</div><h1 class="h1" style="margin:7px 0 0">${safe(g.title)}</h1></div><div class="top-stage">${safe(g.players)} PLAYERS &nbsp; / &nbsp; TWO ROUNDS &nbsp; / &nbsp; ONE CONCEPT</div></div>${stepper()}<div class="stage-grid"><section class="card leftstage">${left}</section><aside class="rightstage">${right}</aside></div><div class="nextline"><div class="actions"><button class="btn btn-small btn-ghost" onclick="goMenu()">← Choose another</button><button class="btn btn-small btn-ghost" onclick="openPrep(current)">No-print setup ↗</button></div><div class="actions">${stage>0?`<button class="btn btn-small btn-ghost" onclick="setStage(${stage-1})">← Back</button>`:''}<button class="btn btn-small" onclick="${stage<3?`setStage(${stage+1})`:'goBoard()'}">${stage===0?'Begin Round 1 →':stage===1?'Begin Round 2 →':stage===2?'Show the debrief →':'View results board →'}</button></div></div>${footer(g.safe)}</main>`;updateClock()}
function setStage(n){if(page!=='game')return;pauseTimer();stage=Math.max(0,Math.min(3,n));resetTimer();render()}
function startGame(i){cancelWheel();page='game';current=i;stage=0;resetTimer();render()}
function goMenu(){cancelWheel();pauseTimer();page='menu';render()}
function goBoard(){cancelWheel();pauseTimer();page='board';render()}
function goHome(){cancelWheel();pauseTimer();page='home';render()}
function toggleFullscreen(){const el=document.documentElement;if(!document.fullscreenElement&&el.requestFullscreen)el.requestFullscreen().catch(()=>{});else if(document.exitFullscreen)document.exitFullscreen().catch(()=>{})}
function pct(g,a,b){if(a===0)return '—';let change=(g.higherBetter?(b-a):(a-b))/Math.abs(a)*100;return `${change>0?'+':''}${change.toFixed(0)}%`}
function saveResult(){let g=GAMES[current],sc=getGameScore(g);if(sc.r1===''||sc.r2===''){toast('Enter both round scores before saving.');return}const name=(document.getElementById('teamName')?.value||state.team||'Unnamed team').trim()||'Unnamed team';state.team=name;state.results.push({team:name,game:g.id,r1:Number(sc.r1),r2:Number(sc.r2),recorded:new Date().toISOString()});save();toast('Saved '+name+' · '+g.short)}
function renderBoard(){let rows=state.results.filter(r=>GAMES.some(g=>g.id===r.game)).reverse();app.innerHTML=header()+`<main class="frame"><div class="menu-top"><div><div class="eyebrow">REAL OUTCOMES / NOT DEMO DATA</div><h1 class="h1">The results <span style="color:var(--lime)">wall.</span></h1><p class="sub">Compare Round 1 and Round 2 for each team. Different games measure different things; don't rank the teams against each other.</p></div><button class="btn btn-ghost" onclick="goMenu()">Choose a new challenge →</button></div><div class="board-summ"><span><b>${rows.length}</b> results saved on this device</span><span><b>${new Set(rows.map(r=>r.team)).size}</b> teams</span><span>All results remain in this browser until exported or cleared.</span></div>${rows.length?`<div class="scoreboard-wrap"><table class="scoreboard-table"><thead><tr><th>TEAM</th><th>EXPERIMENT</th><th>ROUND 1</th><th>ROUND 2</th><th>DIRECTIONAL CHANGE</th><th>TIME</th></tr></thead><tbody>${rows.map(r=>{const g=GAMES.find(x=>x.id===r.game);if(!g)return '';let improved=g.higherBetter?r.r2>r.r1:r.r2<r.r1;return `<tr><td class="strong">${safe(r.team)}</td><td>${safe(g.short)}</td><td>${formatNum(r.r1)} ${safe(g.unit)}</td><td>${formatNum(r.r2)} ${safe(g.unit)}</td><td class="${r.r2===r.r1?'':improved?'good':'bad'}">${pct(g,r.r1,r.r2)}</td><td>${new Date(r.recorded).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty"><h2>No results yet.</h2><p>Run any experiment, enter Round 1 and Round 2 results, then save them here.</p><button class="btn" onclick="goMenu()">Choose an experiment</button></div>`}<div class="nextline"><div class="actions"><button class="btn btn-ghost" onclick="exportCSV()">Export results as CSV ↗</button><button class="btn btn-ghost" onclick="openPrep(-1)">View no-print quick guide</button></div><button class="btn btn-small btn-ghost" onclick="clearBoard()">Clear results on this device</button></div><div class="callout" style="margin-top:14px"><b>How to interpret:</b> Compare the same team's two rounds, including errors and quality. A negative or unchanged result can teach as much as an improvement: look at handoff costs, fairness, queues, familiarity and hidden assumptions.</div>${footer('Recorded scores are private to this browser until exported')}</main>`}
function exportCSV(){let rows=[['Team','Experiment','Metric','Unit','Round 1','Round 2','Directionally better','Recorded at']];state.results.forEach(r=>{const g=GAMES.find(x=>x.id===r.game);if(!g)return;rows.push([r.team,g.title,g.measure,g.unit,r.r1,r.r2,(g.higherBetter?r.r2>r.r1:r.r2<r.r1)?'Yes':r.r2===r.r1?'No change':'No',r.recorded])});let csv=rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='agile_flow_lab_results.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Results CSV exported')}
function clearBoard(){if(confirm('Clear all saved results on this device? This cannot be undone.')){state.results=[];save();render()}}
function formRow(txt){return `<li>${safe(txt)}</li>`}
function makeExtra(g){
 if(g.id==='coin')return `<div class="p-rule"><h3>Five customer orders - toss record</h3><table class="p-table"><tr><th>Order</th>${[1,2,3,4,5,6].map(x=>`<th>Station ${x}</th>`).join('')}</tr>${[1,2,3,4,5].map(x=>`<tr><th>${x}</th>${[1,2,3,4,5,6].map(()=>'<td style="height:25px">&nbsp;</td>').join('')}</tr>`).join('')}</table><p>Record H / T for each person, then first and final completed order times.</p></div>`;
 if(g.id==='switch')return `<div class="p-rule"><h3>Fold two blank A4 sheets into three columns per player</h3><p>Round 1 across each row. Round 2 down each column. Complete 36 entries in both rounds.</p><table class="p-table"><tr><th>STOCK 1–12</th><th>DELIVERY A–L</th><th>RETURNS 12–1</th></tr>${Array.from({length:12},()=>'<tr><td style="height:26px"></td><td></td><td></td></tr>').join('')}</table></div>`;
 if(g.id==='bottleneck')return `<div class="p-rule"><h3>Set up three stations</h3><div class="p-grid" style="grid-template-columns:repeat(3,1fr)"><div class="p-token"><h2>PICK</h2>Add a tick</div><div class="p-token"><h2>PACK</h2>Write READY FOR COLLECTION</div><div class="p-token"><h2>HANDOVER</h2>Initial the card</div></div><p>Hand-tear 24 A4 slips from six sheets. Use front for Round 1; turn over for Round 2.</p></div>`;
 if(g.id==='approval')return `<div class="p-rule"><h3>Hypothetical request cards - not a real store policy</h3><p><b>ROUND 2 RULE:</b> GREEN / ROUTINE handled by the team; RED / EXCEPTION by the manager. Round 1: the manager takes 4 seconds per card. Time all 12 requests in both rounds.</p><div class="p-grid">${Array.from({length:12},(_,i)=>`<div class="p-token"><b>${i>=10?'RED - EXCEPTION':'GREEN - ROUTINE'}</b><br>${i===10?'Unusual high-value situation':i===11?'Missing proof / policy exception':(['Order-status question','Routine delivery enquiry','Update collection contact','Find stock location','Confirm click & collect','Check order reference','Confirm delivery window','Standard service enquiry','Update a phone number','Collection ready message'][i])}</div>`).join('')}</div></div>`;
 if(g.id==='feedback')return `<div class="p-rule"><h3>Two showroom layouts: only the designer can see these</h3><div class="p-drawing"><b>LAYOUT A</b><svg viewBox="0 0 260 155"><rect x="76" y="38" width="112" height="55" rx="5" fill="none" stroke="black" stroke-width="3"/><rect x="90" y="95" width="80" height="40" fill="none" stroke="black" stroke-width="2"/><ellipse cx="129" cy="112" rx="26" ry="11" fill="none" stroke="black" stroke-width="2"/><circle cx="44" cy="47" r="12" fill="none" stroke="black" stroke-width="2"/><path d="M44 59v30" stroke="black" stroke-width="3"/><circle cx="211" cy="104" r="15" fill="none" stroke="black" stroke-width="2"/><rect x="10" y="113" width="41" height="18" fill="none" stroke="black" stroke-width="2"/></svg><p>Six features: sofa centre; rug beneath; coffee table on rug; lamp left; plant right; price ticket bottom-left.</p></div><div class="p-drawing"><b>LAYOUT B</b><svg viewBox="0 0 260 155"><rect x="76" y="47" width="108" height="80" fill="none" stroke="black" stroke-width="3"/><line x1="76" y1="70" x2="184" y2="70" stroke="black" stroke-width="2"/><rect x="39" y="84" width="24" height="24" fill="none" stroke="black" stroke-width="2"/><rect x="195" y="84" width="24" height="24" fill="none" stroke="black" stroke-width="2"/><rect x="113" y="11" width="35" height="25" fill="none" stroke="black" stroke-width="2"/><circle cx="211" cy="47" r="9" fill="none" stroke="black" stroke-width="2"/><rect x="94" y="131" width="70" height="17" fill="none" stroke="black" stroke-width="2"/></svg><p>Six features: bed centre; table each side; artwork above; lamp top-right; narrow rug below.</p></div></div>`;
 if(g.id==='estimate')return `<div class="p-rule"><h3>ROUND 1 - SHOW THIS FIRST</h3><p><b>Estimate the total minutes to prepare TEN customer orders for collection.</b></p><h3>ROUND 2 - NOW REVEAL</h3><p>Eight orders are already on the collection shelf. Two are in the reserve bay. One of those needs an extra packaging check. Team size and walking distance are not specified: ask questions before estimating.</p><p>Write highest estimate: ____ min; lowest: ____ min; spread: ____ min.</p></div>`;
 return '';
}
function kitSheet(g){return `<h1 class="print-title">${safe(g.n).padStart(2,'0')} · ${safe(g.title)}</h1><p><b>${safe(g.category)} · ${safe(g.players)} players · 10-minute facilitation slot</b></p><p>${safe(g.hook)}</p><div class="p-rule"><b>KIT:</b> ${safe(g.kit)}<br><b>METRIC:</b> ${safe(g.measure)}</div><div class="p-columns"><div><h3>SET UP</h3><ol class="p-steps">${g.setup.map(formRow).join('')}</ol><h3>ROUND 1 — ${safe(g.round1Label)}</h3><ol class="p-steps">${g.round1.map(formRow).join('')}</ol></div><div><h3>ROUND 2 — ${safe(g.round2Label)}</h3><ol class="p-steps">${g.round2.map(formRow).join('')}</ol><h3>DEBRIEF</h3><p><b>${safe(g.reveal)}</b></p><p><i>${safe(g.question)}</i></p></div></div><div class="p-rule"><b>ROUND 1:</b> ______ ${safe(g.unit)} &nbsp;&nbsp; <b>ROUND 2:</b> ______ ${safe(g.unit)} &nbsp;&nbsp; <b>OBSERVATION:</b> ____________________</div>${makeExtra(g)}<div class="sheet-footer">SLEEQ · Retail Team Challenges · Facilitator material. Exploratory demonstrations; outcomes are measured, not guaranteed.</div>`}
function printKit(i){let g=GAMES[i];let area=document.getElementById('printArea');area.innerHTML=kitSheet(g);document.body.classList.add('printing');setTimeout(()=>window.print(),80)}
function printAllQuickGuide(){let area=document.getElementById('printArea');area.innerHTML=`<h1>Retail Team Challenges | Facilitator's quick guide</h1><p>Keep one group to 10 minutes within each 15-minute booth slot. All scenario rules and prices are illustrative. Measure both rounds against the same endpoint, materials and definition of done.</p><table class="p-table"><tr><th>#</th><th>Game</th><th>Kit</th><th>Measure</th><th>Debrief question</th></tr>${GAMES.map(g=>`<tr><td>${g.n}</td><td><b>${safe(g.short)}</b></td><td>${safe(g.kit)}</td><td>${safe(g.measure)}</td><td>${safe(g.question)}</td></tr>`).join('')}</table><h3>10-minute running order</h3><p>0–1 Hook & rules · 1–3 Round 1 · 3–5 Round 2 · 5–7 Reveal results · 7–9.5 Debrief · 9.5–10 Close</p><h3>Facilitation guardrails</h3><ul><li>Change one process condition, not the difficulty of the task.</li><li>Do not state that the new process 'always wins'. Handoff cost, learning and random variation matter.</li><li>For throughput, count only fully completed, accepted work.</li><li>Protect people and time: do not reward rushing at the expense of safety or quality.</li><li>End with a practical workplace action, not a framework lecture.</li></ul><div class="sheet-footer">SLEEQ + StoreConnect · Amart Retail Team Challenges · Offline shareable presentation · October 2026</div>`;document.body.classList.add('printing');setTimeout(()=>window.print(),80)}
window.addEventListener('afterprint',()=>{document.body.classList.remove('printing');document.getElementById('printArea').innerHTML=''})

function openPrep(i){
  let title,entries,notice;
  if(i<0){
    title='Your exact kit: no printing required';
    entries=[
      'You have a ream of blank A4 paper, 100 index cards, coloured sticky tape, 5 coins, permanent markers and ballpoint pens. The on-screen timer replaces a stopwatch.',
      'Prep 17 reusable index cards: 3 station signs (PICK / PACK / HANDOVER), 12 request cards and 2 secret showroom sketches.',
      'Use blank A4 for worksheets, score notes, estimate sheets and paper order slips. Tear or fold by hand; no scissors or printer required.',
      'Use coloured sticky tape to mark station zones and a DONE zone. The same index cards can be reused for every visiting team.',
      'Recommended four: Five Customer Orders, Busy Store Manager, Click & Collect Rush and Approve This?. Prepare the others only if you have time.',
      'In every 15-minute slot: 1 min rules, 2 min Round 1, 2 min Round 2, 3 min discuss, 2 min transition; 5 min to reset the table.'
    ];
    notice='Estimated set-aside: only 17 of your 100 index cards, plus ordinary A4 paper. Keep sample and secret cards on the facilitator side of the table.';
  }else{
    const g=GAMES[i];title=`${g.n}. ${g.title}: write this by hand`;
    entries=g.hostPrep;
    notice='FACILITATOR ONLY · Prepare once, then reuse. Keep any secret examples or acceptance criteria out of visitors’ sight until the correct round.';
  }
  const layer=document.createElement('div');layer.className='prep-layer';layer.id='prepLayer';layer.setAttribute('role','presentation');
  layer.innerHTML=`<section class="prep-dialog" role="dialog" aria-modal="true" aria-label="Facilitator preparation"><div class="prep-head"><span class="eyebrow">NO PRINTING REQUIRED · HOST VIEW</span><button class="close" onclick="closePrep()">✕ Close</button></div><h2>${safe(title)}</h2><ol>${entries.map(x=>`<li>${safe(x)}</li>`).join('')}</ol><div class="prep-notice">${safe(notice)}</div></section>`;
  layer.addEventListener('click',(e)=>{if(e.target===layer)closePrep()});document.body.appendChild(layer);
}
function closePrep(){document.getElementById('prepLayer')?.remove()}
document.addEventListener('keydown',e=>{if(e.target&&['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.key==='Escape'){if(document.getElementById('prepLayer')){closePrep();return}goMenu();return}if(page==='game'&&e.code==='Space'){e.preventDefault();switchTimer();return}if(page==='game'&&e.key==='ArrowRight'){setStage(Math.min(stage+1,3));return}if(page==='game'&&e.key==='ArrowLeft'){setStage(Math.max(stage-1,0));return}if(page==='menu'&&/^[1-6]$/.test(e.key)){startGame(Number(e.key)-1)}});
resetTimer();render();
</script>
</body></html>
